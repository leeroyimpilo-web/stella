plugins { id 'com.android.application' }
android {
    namespace 'za.co.lottolab.studio'
    compileSdk 36
    defaultConfig {
        applicationId 'za.co.lottolab.studio'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '0.7.0'
        testInstrumentationRunner 'za.co.lottolab.studio.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            if (System.getenv('LOTTOLAB_KEYSTORE')) {
                storeFile file(System.getenv('LOTTOLAB_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true; disable 'ObsoleteSdkInt', 'SetTextI18n', 'MissingTranslation' }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
