name: Build Lotto Intelligence APK

on:
  push:
    branches: [main]
    paths:
      - "lotto-android/**"
      - ".github/workflows/lotto-android.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: lotto-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Embed historical results archive (when available)
        run: |
          mkdir -p app/src/main/assets
          if curl -fsSL --retry 3 --max-time 120 "https://bettip.co.za/api/v1/lotto/draws.json" -o app/src/main/assets/draws.json.tmp && python3 -m json.tool app/src/main/assets/draws.json.tmp >/dev/null; then
            mv app/src/main/assets/draws.json.tmp app/src/main/assets/draws.json
            echo "Bundled free SA lottery history"
          else
            rm -f app/src/main/assets/draws.json.tmp
            echo "Archive download failed; small offline seed available"
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lotto-intelligence-debug-apk
          path: lotto-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
