name: Build LeadRadar USA APK
on:
  push:
    branches: [feature/leadradar-usa-sprint1]
    paths:
      - 'leadradar-android/**'
      - '.github/workflows/leadradar-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon -p leadradar-android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LeadRadarUSA-debug-apk
          path: leadradar-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
