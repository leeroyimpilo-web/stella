name: Lotto Lab APK
on:
  push:
    branches: [main]
    paths:
      - 'lotto-probability-lab/**'
      - '.github/workflows/lotto-lab-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probability engine tests
        working-directory: lotto-probability-lab
        run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lotto-lab-debug-signing-v1
      - name: Build installable signed APK
        working-directory: lotto-probability-lab/android
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Verify APK certificate and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs lotto-probability-lab/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging lotto-probability-lab/android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p apk-output
          cp lotto-probability-lab/android/app/build/outputs/apk/debug/app-debug.apk apk-output/LottoLab-1.0.apk
          sha256sum apk-output/LottoLab-1.0.apk > apk-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LottoLab-APK
          path: apk-output/*
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline Android smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: lotto-probability-lab/android
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LottoLab-test-results
          path: lotto-probability-lab/android/app/build/reports/androidTests/
