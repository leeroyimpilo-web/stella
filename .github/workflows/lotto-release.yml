name: Build Signed Lotto Retail APK
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      LOTTO_LICENSE_SERVER_URL: ${{ secrets.LOTTO_LICENSE_SERVER_URL }}
      LOTTO_LICENSE_PUBLIC_KEY_B64: ${{ secrets.LOTTO_LICENSE_PUBLIC_KEY_B64 }}
      LOTTO_STORE_PASSWORD: ${{ secrets.LOTTO_STORE_PASSWORD }}
      LOTTO_KEY_ALIAS: ${{ secrets.LOTTO_KEY_ALIAS }}
      LOTTO_KEY_PASSWORD: ${{ secrets.LOTTO_KEY_PASSWORD }}
      LOTTO_KEYSTORE_FILE: ${{ github.workspace }}/lotto-android/retail-signing.jks
    defaults:
      run:
        working-directory: lotto-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure production licence and signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.LOTTO_KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$LOTTO_LICENSE_SERVER_URL"
          test -n "$LOTTO_LICENSE_PUBLIC_KEY_B64"
          test -n "$LOTTO_STORE_PASSWORD"
          test -n "$LOTTO_KEY_ALIAS"
          test -n "$LOTTO_KEY_PASSWORD"
          test -n "$KEYSTORE_B64"
          case "$LOTTO_LICENSE_SERVER_URL" in https://*) ;; *) echo "HTTPS required"; exit 1;; esac
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$LOTTO_KEYSTORE_FILE"
          chmod 600 "$LOTTO_KEYSTORE_FILE"
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Bundle available historical archive
        run: |
          mkdir -p app/src/main/assets
          if curl -fsSL --retry 3 --max-time 120 "https://bettip.co.za/api/v1/lotto/draws.json" -o app/src/main/assets/draws.json.tmp && python3 -m json.tool app/src/main/assets/draws.json.tmp >/dev/null; then
            mv app/src/main/assets/draws.json.tmp app/src/main/assets/draws.json
          else
            rm -f app/src/main/assets/draws.json.tmp
            echo "Historical archive fetch unavailable"
          fi
      - name: Build signed, licence-gated release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lotto-intelligence-retail-signed-apk
          path: lotto-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
