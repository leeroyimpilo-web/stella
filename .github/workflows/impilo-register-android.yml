name: Build Impilo Register APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ImpiloRegister/**"
      - ".github/workflows/impilo-register-android.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: ImpiloRegister
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ImpiloRegister-APK
          path: ImpiloRegister/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
