name: Generate STELLA AI Audio
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "scripts/generate_audio_pack.py"
      - ".github/workflows/voices.yml"

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate voices, ambience and SFX
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/generate_audio_pack.py

      - name: Commit generated audio
        run: |
          git config user.name "stella-audio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/voice app/src/main/assets/audio
          if git diff --cached --quiet; then
            echo "Audio already up to date."
          else
            git commit -m "Generate STELLA Chapter 1 AI voice pack"
            git push
          fi
