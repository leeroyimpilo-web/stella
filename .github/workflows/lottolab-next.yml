name: LottoLab / APK and native UI checks
on:
  push:
    branches: ["lottolab-next/**"]
    paths: ["lottolab-next/**", ".github/workflows/lottolab-next.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lottolab-next-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LOTTOLAB_KEYSTORE: ${{ runner.temp }}/lottolab-signing/preview.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Retain preview signing identity
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LOTTOLAB_KEYSTORE }}
          key: lottolab-next-preview-signing-v2
      - name: Prepare persistent development signer
        run: |
          mkdir -p "$(dirname "$LOTTOLAB_KEYSTORE")"
          if [ ! -f "$LOTTOLAB_KEYSTORE" ]; then
            keytool -genkeypair -noprompt -keystore "$LOTTOLAB_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=LottoLab Preview, O=LottoLab, C=ZA'
          fi
      - name: Save development signer before tests
        if: steps.signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LOTTOLAB_KEYSTORE }}
          key: lottolab-next-preview-signing-v2
      - name: Unit tests, lint and APK builds
        run: gradle --no-daemon -p lottolab-next :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verify installable APK signing
        run: |
          mkdir -p lottolab-next/qa
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs lottolab-next/app/build/outputs/apk/debug/app-debug.apk > lottolab-next/qa/apk-verification.txt
          expected=$(keytool -exportcert -keystore "$LOTTOLAB_KEYSTORE" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          grep -Fq "certificate SHA-256 digest: $expected" lottolab-next/qa/apk-verification.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p lottolab-next/qa
            adb install -r lottolab-next/app/build/outputs/apk/debug/app-debug.apk
            adb install -r lottolab-next/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w za.co.lottolab.studio.test/za.co.lottolab.studio.SmokeInstrumentation | tee lottolab-next/qa/instrumentation.txt
            adb logcat -d -s AndroidRuntime > lottolab-next/qa/runtime.txt
            adb pull /sdcard/Android/data/za.co.lottolab.studio/files/qa/ lottolab-next/qa/screens
            grep -q 'passed=true' lottolab-next/qa/instrumentation.txt
      - name: Upload preview APK and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LottoLab-0.2
          path: |
            lottolab-next/app/build/outputs/apk/debug/app-debug.apk
            lottolab-next/app/build/reports/tests/testDebugUnitTest/
            lottolab-next/app/build/reports/lint-results-debug.html
            lottolab-next/qa/
          if-no-files-found: error
