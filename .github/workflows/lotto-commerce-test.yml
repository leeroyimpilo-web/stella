name: Test Lotto Commerce
on:
  push:
    branches: [main]
    paths:
      - 'lotto-android/commerce/**'
      - '.github/workflows/lotto-commerce-test.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lotto-android/commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax verification
        run: node --check server.mjs && node --check lib.mjs && node --check public/app.js
      - name: Licence and payment safety tests
        run: node --test tests/*.test.mjs
