name: MP3 Dork APK

on:
  push:
    branches: [main]
    paths:
      - 'mp3-dork-app/**'
      - '.github/workflows/mp3-dork-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mp3-dork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mp3-dork-debug-signing-v1
      - name: Compile APK and run core tests
        working-directory: mp3-dork-app
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Start controlled audio fixture server
        run: |
          python3 mp3-dork-app/tests/fixture_server.py > /tmp/mp3-fixture.log 2>&1 &
          curl --retry 5 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:8765/health
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify download, persistence, UI and offline playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: mp3-dork-app
          script: |
            adb reverse tcp:8765 tcp:8765
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant za.co.mp3dork android.permission.POST_NOTIFICATIONS
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
            mkdir -p qa-output
            adb pull /sdcard/Android/data/za.co.mp3dork/files/qa qa-output/ || true
            adb logcat -d -v time > qa-output/device-log.txt
      - name: Verify signing certificate and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs mp3-dork-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging mp3-dork-app/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p mp3-apk-output
          cp mp3-dork-app/app/build/outputs/apk/debug/app-debug.apk mp3-apk-output/MP3Dork-1.0.apk
          sha256sum mp3-apk-output/MP3Dork-1.0.apk > mp3-apk-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MP3Dork-APK
          path: mp3-apk-output/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MP3Dork-test-results
          path: |
            mp3-dork-app/app/build/reports/tests/
            mp3-dork-app/app/build/reports/androidTests/
            mp3-dork-app/qa-output/
