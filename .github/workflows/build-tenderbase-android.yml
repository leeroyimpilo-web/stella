name: TenderBase Android APK (isolated build)

on:
  push:
    branches: [tenderbase-apk-build-2026-10-27]
    paths:
      - '.github/workflows/build-tenderbase-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get original TenderBase app
        uses: actions/checkout@v4
        with:
          repository: tenderbase/TenderbaseAPK
          ref: main
          path: appsource
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Android SDK packages from hosted runner
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Install dependencies
        working-directory: appsource
        run: npm install --no-audit --no-fund
      - name: Generate Android wrapper
        working-directory: appsource
        env:
          TENDERBASE_APP_URL: https://tenderbase.vercel.app
        run: |
          npx cap add android
          npx cap sync android
      - name: Assemble installable debug APK
        working-directory: appsource/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=2
      - name: APK size and checksum
        run: |
          ls -lh appsource/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum appsource/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TenderBase-Android-APK-preview
          path: appsource/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct APK download (preview)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp appsource/android/app/build/outputs/apk/debug/app-debug.apk TenderBase-Android-Preview.apk
          gh release create tenderbase-android-preview-20261027 TenderBase-Android-Preview.apk --repo "$GITHUB_REPOSITORY" --title "TenderBase Android APK - development preview" --notes "Development preview compiled from tenderbase/TenderbaseAPK. The Android wrapper points to https://tenderbase.vercel.app, currently documented as an undeployed placeholder. App functions require the real hosted Next.js interface." --prerelease --target "$GITHUB_SHA" 
