name: Build Impilo Lead Scanner APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "impilo-facebook-lead-scanner-package/**"
      - ".github/workflows/build-impilo-lead-scanner.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        run: |
          mkdir -p generated
          cat impilo-facebook-lead-scanner-package/source.b64.part* | tr -d '\n\r' | base64 -d > generated/ImpiloFacebookLeadScanner_v1.zip
          unzip -q generated/ImpiloFacebookLeadScanner_v1.zip -d generated
          test -f generated/ImpiloFacebookLeadScanner/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: generated/ImpiloFacebookLeadScanner
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: impilo-facebook-lead-scanner-debug
          path: generated/ImpiloFacebookLeadScanner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
